server:
  port: 8088
spring:
  application:
    name: post-config-server  # Must match the config file name in Git
  cloud:
    config:
      server:
        git:
          uri: ${GIT_REPO_URI:https://github.com/venkatram64/my-ms-centralized-config.git}  # Replace with your Git repo URL
          default-label: ${GIT_DEFAULT_BRANCH:main}  # Specify your default branch
          search-paths: config
          clone-on-start: true
      retry:
        initial-interval: 3000
        max-attempts: 5
  output:
    ansi:
      enabled: always

