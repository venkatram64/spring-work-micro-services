apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-config-server-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-config-server-app
  template:
    metadata:
      labels:
        app: post-config-server-app
    spec:
      containers:
        - name: post-config-server-img
          image: explorejava/post-config-service
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "git"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI
              value: "https://github.com/venkatram64/k8s-ms-cntralized-config.git"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_SEARCH-PATHS
              value: "config"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START
              value: "true"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_FORCE_PULL
              value: "true"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: post-config-server  # this service name is used in other microservices yaml files
spec:
  type: ClusterIP
  selector:
    app: post-config-server-app  # this selector is used in above template
  ports:
    - protocol: TCP
      port: 8088
      targetPort: 8088