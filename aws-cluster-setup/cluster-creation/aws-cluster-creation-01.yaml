apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: my-dev-eks-cluster
  region: ap-south-1
  version: "1.33"
availabilityZones:
  - ap-south-1a
  - ap-south-1b
nodeGroups:
  - name: my-dev-eks-cluster-ng
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    # volumeSize: 20
    # ssh:
    #   allow: true  # optional, allows SSH access
