apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-service-app
  template:
    metadata:
      labels:
        app: content-service-app
    spec:
      containers:
        - name: content-service-img
          image: explorejava/content-service:latest  #image is built by Dockerfile
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://post-config-server:8088"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://post-config-server:8088"
            - name: SPRING_APPLICATION_NAME
              value: "content-service"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://service-registry-in-eureka:8761/eureka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://content-mysql:3306/content_db?useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "root"
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: "org.hibernate.dialect.MySQLDialect"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "com.mysql.cj.jdbc.Driver"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin-server:9411/api/v2/spans"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
spec:
  type: ClusterIP
  selector:
    app: content-service-app
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
